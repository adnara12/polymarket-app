<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  header { background: #1a1d27; border-bottom: 1px solid #2d3148;
           padding: 1rem 1.5rem; display: flex; align-items: center;
           justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 1.2rem; font-weight: 600; color: #a78bfa; }
  header span { font-size: 0.8rem; color: #64748b; }
  nav { display: flex; gap: 8px; }
  nav button { background: transparent; border: 1px solid #2d3148; color: #94a3b8;
               padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  nav button.active, nav button:hover { background: #a78bfa; color: #fff; border-color: #a78bfa; }
  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
  .page { display: none; }
  .page.active { display: block; }

  /* Filtros */
  .filters-bar { background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px;
                 padding: 1rem; margin-bottom: 1rem; }
  .filters-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; min-width: 130px; flex: 1; }
  .filter-group label { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
  .filter-group input, .filter-group select {
    background: #0f1117; border: 1px solid #2d3148; color: #e2e8f0;
    padding: 6px 10px; border-radius: 6px; font-size: 0.83rem; width: 100%; }
  .filter-group input:focus, .filter-group select:focus { outline: none; border-color: #a78bfa; }
  .filters-actions { display: flex; gap: 8px; align-items: flex-end; }
  .btn { background: #a78bfa; color: #fff; border: none; padding: 7px 16px;
         border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: opacity .2s; white-space: nowrap; }
  .btn:hover { opacity: 0.85; }
  .btn.danger  { background: #ef4444; }
  .btn.outline { background: transparent; border: 1px solid #a78bfa; color: #a78bfa; }
  .btn.ghost   { background: transparent; border: 1px solid #2d3148; color: #64748b; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 10px; margin-bottom: 1rem; }
  .stat-card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px; padding: 1rem; }
  .stat-card .label { font-size: 0.75rem; color: #64748b; margin-bottom: 4px; }
  .stat-card .value { font-size: 1.4rem; font-weight: 600; color: #a78bfa; }

  /* Tabla */
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #2d3148; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead { background: #1a1d27; }
  th { padding: 10px 14px; text-align: left; color: #64748b; font-weight: 500;
       cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: #a78bfa; }
  td { padding: 10px 14px; border-top: 1px solid #1e2235; white-space: nowrap; }
  tr:hover td { background: #1a1d27; }
  .wallet { font-family: monospace; font-size: 0.8rem; color: #a78bfa; cursor: pointer; }
  .wallet:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
  .badge.green  { background: #14532d; color: #4ade80; }
  .badge.red    { background: #450a0a; color: #f87171; }
  .badge.yellow { background: #422006; color: #fbbf24; }
  .badge.purple { background: #2e1065; color: #c4b5fd; }
  .bar-wrap { width: 70px; background: #1e2235; border-radius: 4px; height: 6px; display: inline-block; vertical-align: middle; }
  .bar-fill { height: 6px; border-radius: 4px; background: #a78bfa; }
  .results-count { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
              z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-bg.open { display: flex; }
  .modal { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px;
           width: 100%; max-width: 820px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
  .modal h2 { font-size: 0.95rem; margin-bottom: 1rem; color: #a78bfa; word-break: break-all; }
  .close-btn { float: right; background: transparent; border: none; color: #64748b; font-size: 1.2rem; cursor: pointer; }

  /* Watchlist */
  .watchlist-item { background: #1a1d27; border: 1px solid #2d3148; border-radius: 8px;
                    padding: 12px 16px; margin-bottom: 8px;
                    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .watchlist-item .alias { font-weight: 500; }
  .watchlist-item .waddr { font-family: monospace; font-size: 0.78rem; color: #64748b; }
  .empty  { text-align: center; padding: 3rem 1rem; color: #64748b; }
  .loader { text-align: center; padding: 2rem; color: #64748b; font-size: 0.9rem; }

  @media (max-width: 600px) {
    th, td { padding: 8px 8px; font-size: 0.78rem; }
    .stat-card .value { font-size: 1.1rem; }
    .filter-group { min-width: 100px; }
  }
</style>
</head>
<body>
<header>
  <h1>Polymarket Tracker</h1>
  <nav>
    <button class="active" onclick="showPage('ranking',this)">Ranking</button>
    <button onclick="showPage('watchlist',this)">Watchlist</button>
  </nav>
  <span id="last-update">Cargando...</span>
</header>

<main>
  <div id="page-ranking" class="page active">

    <!-- FILTROS -->
    <div class="filters-bar">
      <div class="filters-row">
        <div class="filter-group" style="min-width:180px;flex:2">
          <label>Buscar wallet o alias</label>
          <input type="text" id="f-search" placeholder="0x... o nombre" oninput="applyFilters()">
        </div>
        <div class="filter-group">
          <label>Mín. trades</label>
          <select id="f-min-trades" onchange="loadRanking()">
            <option value="3">3+</option>
            <option value="5">5+</option>
            <option value="10">10+</option>
            <option value="20">20+</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Precio medio</label>
          <select id="f-price-op">
            <option value="">— cualquiera —</option>
            <option value="lt">Menor que</option>
            <option value="gt">Mayor que</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Valor precio</label>
          <input type="number" id="f-price-val" placeholder="0.30" step="0.01" min="0" max="1" oninput="applyFilters()">
        </div>
        <div class="filter-group">
          <label>Invertido total</label>
          <select id="f-inv-op">
            <option value="">— cualquiera —</option>
            <option value="gt">Mayor que</option>
            <option value="lt">Menor que</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Valor (USDC)</label>
          <input type="number" id="f-inv-val" placeholder="1000" min="0" oninput="applyFilters()">
        </div>
      </div>
      <div class="filters-row" style="margin-top:10px">
        <div class="filter-group">
          <label>% Acierto long. mín.</label>
          <input type="number" id="f-longshot" placeholder="65" min="0" max="100" oninput="applyFilters()">
        </div>
        <div class="filter-group">
          <label>Activo últimos días</label>
          <select id="f-days" onchange="applyFilters()">
            <option value="">— cualquiera —</option>
            <option value="1">Hoy</option>
            <option value="7">7 días</option>
            <option value="30">30 días</option>
            <option value="90">90 días</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Ordenar por</label>
          <select id="f-sort" onchange="applyFilters()">
            <option value="insider_score">Score insider</option>
            <option value="longshot_win_rate">% Acierto longshots</option>
            <option value="total_pnl">PnL total</option>
            <option value="total">Nº trades</option>
            <option value="avg_price">Precio medio</option>
            <option value="last_seen">Última actividad</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Orden</label>
          <select id="f-order" onchange="applyFilters()">
            <option value="desc">Mayor primero</option>
            <option value="asc">Menor primero</option>
          </select>
        </div>
        <div class="filters-actions">
          <button class="btn ghost" onclick="resetFilters()">Limpiar</button>
          <button class="btn outline" onclick="refreshData()">Actualizar datos</button>
        </div>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Traders</div><div class="value" id="stat-traders">—</div></div>
      <div class="stat-card"><div class="label">Score insider máx.</div><div class="value" id="stat-max-score">—</div></div>
      <div class="stat-card"><div class="label">% Acierto long. máx.</div><div class="value" id="stat-max-winrate">—</div></div>
      <div class="stat-card"><div class="label">Precio medio</div><div class="value" id="stat-avg-price">—</div></div>
    </div>

    <div class="results-count" id="results-count"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Wallet / Alias</th>
            <th>Trades</th>
            <th>Precio medio</th>
            <th>PnL total</th>
            <th>% Acierto Long.</th>
            <th>Score insider</th>
            <th>Última actividad</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ranking-body">
          <tr><td colspan="9" class="loader">Cargando traders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="page-watchlist" class="page">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;align-items:flex-end">
      <div class="filter-group" style="min-width:240px">
        <label>Wallet (0x...)</label>
        <input type="text" id="wl-wallet" placeholder="0x...">
      </div>
      <div class="filter-group" style="min-width:160px">
        <label>Alias (opcional)</label>
        <input type="text" id="wl-alias" placeholder="Mi trader favorito">
      </div>
      <button class="btn" onclick="addWatchlist()">Añadir</button>
    </div>
    <div id="watchlist-list"><div class="loader">Cargando...</div></div>
  </div>
</main>

<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <button class="close-btn" onclick="closeModalDirect()">✕</button>
    <h2 id="modal-wallet"></h2>
    <div class="stats-grid" id="modal-stats"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Mercado</th><th>Lado</th><th>Precio</th><th>Tamaño</th><th>Fecha</th><th>Dificultad</th></tr></thead>
        <tbody id="modal-trades"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var allTraders = [];

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'watchlist') loadWatchlist();
}

async function loadRanking() {
  var min = document.getElementById('f-min-trades').value;
  try {
    var resp = await fetch('/api/ranking?min_trades=' + min + '&limit=500');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    allTraders = await resp.json();
    updateStats(allTraders);
    applyFilters();
    document.getElementById('last-update').textContent =
      'Actualizado: ' + new Date().toLocaleTimeString('es-ES');
  } catch(e) {
    document.getElementById('ranking-body').innerHTML =
      '<tr><td colspan="9" class="empty">Error: ' + e.message + '</td></tr>';
  }
}

function fmtScore(v) {
  if (!v) return '—';
  if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
}
function updateStats(traders) {
  document.getElementById('stat-traders').textContent = traders.length;
  var maxSc = traders.length ? fmtScore(Math.max.apply(null, traders.map(function(t){ return t.insider_score||0; }))) : '—';
  document.getElementById('stat-max-score').textContent = maxSc;
  var maxWr = traders.length ? Math.max.apply(null, traders.map(function(t){ return t.longshot_win_rate||0; })).toFixed(1)+'%' : '—';
  document.getElementById('stat-max-winrate').textContent = maxWr;
  var avgP = traders.length ? (traders.reduce(function(s,t){ return s+(t.avg_price||0); },0)/traders.length).toFixed(2) : '—';
  document.getElementById('stat-avg-price').textContent = avgP;
}

function applyFilters() {
  var search   = document.getElementById('f-search').value.toLowerCase();
  var priceOp  = document.getElementById('f-price-op').value;
  var priceVal = parseFloat(document.getElementById('f-price-val').value);
  var invOp    = document.getElementById('f-inv-op').value;
  var invVal   = parseFloat(document.getElementById('f-inv-val').value);
  var longshot = parseFloat(document.getElementById('f-longshot').value) || 0;
  var days     = parseInt(document.getElementById('f-days').value) || 0;
  var sortKey  = document.getElementById('f-sort').value;
  var sortAsc  = document.getElementById('f-order').value === 'asc';
  var cutoff   = days ? new Date(Date.now() - days*86400000) : null;

  var filtered = allTraders.filter(function(t) {
    if (search && !t.wallet.toLowerCase().includes(search) && !(t.alias||'').toLowerCase().includes(search)) return false;
    if (priceOp && !isNaN(priceVal)) {
      if (priceOp === 'lt' && (t.avg_price||0) >= priceVal) return false;
      if (priceOp === 'gt' && (t.avg_price||0) <= priceVal) return false;
    }
    if (invOp && !isNaN(invVal)) {
      if (invOp === 'gt' && (t.total_invested||0) <= invVal) return false;
      if (invOp === 'lt' && (t.total_invested||0) >= invVal) return false;
    }
    if (longshot && (t.longshot_win_rate||0) < longshot) return false;
    if (cutoff && t.last_seen && new Date(t.last_seen) < cutoff) return false;
    return true;
  });

  filtered.sort(function(a,b) {
    var av = a[sortKey]||0, bv = b[sortKey]||0;
    if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av-bv : bv-av;
  });

  document.getElementById('results-count').textContent =
    filtered.length + ' traders' + (filtered.length < allTraders.length ? ' (filtrado de ' + allTraders.length + ')' : '');

  renderTable(filtered);
}

function resetFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-price-op').value = '';
  document.getElementById('f-price-val').value = '';
  document.getElementById('f-inv-op').value = '';
  document.getElementById('f-inv-val').value = '';
  document.getElementById('f-longshot').value = '';
  document.getElementById('f-days').value = '';
  document.getElementById('f-sort').value = 'insider_score';
  document.getElementById('f-order').value = 'desc';
  applyFilters();
}

function renderTable(traders) {
  var body = document.getElementById('ranking-body');
  if (!traders.length) {
    body.innerHTML = '<tr><td colspan="9" class="empty">No hay traders con estos filtros</td></tr>';
    return;
  }
  body.innerHTML = traders.map(function(t, i) {
    var wr  = t.longshot_win_rate || 0;
    var sc  = t.insider_score || 0;
    var bdg = wr >= 90 ? 'purple' : wr >= 75 ? 'yellow' : 'green';
    var dt  = t.last_seen ? new Date(t.last_seen).toLocaleDateString('es-ES') : '—';
    var sw  = t.wallet.slice(0,6) + '...' + t.wallet.slice(-4);
    var al  = t.alias || '';
    var pnl = t.total_pnl ? (t.total_pnl >= 1e6 ? (t.total_pnl/1e6).toFixed(2)+'M'
                           : t.total_pnl >= 1e3 ? (t.total_pnl/1e3).toFixed(1)+'K'
                           : t.total_pnl.toFixed(0)) : '—';
    return '<tr>' +
      '<td style="color:#64748b">' + (i+1) + '</td>' +
      '<td><span class="wallet" title="' + t.wallet + '" onclick="openTrader(\'' + t.wallet + '\')">' + sw + '</span>' +
      (al ? '<br><span style="font-size:0.75rem;color:#94a3b8">' + al + '</span>' : '') + '</td>' +
      '<td>' + t.total + '</td>' +
      '<td>' + (t.avg_price||0).toFixed(2) + '</td>' +
      '<td style="color:#4ade80">' + pnl + ' USDC</td>' +
      '<td><span class="badge ' + bdg + '">' + wr.toFixed(1) + '%</span>' +
        ' <span style="color:#64748b;font-size:0.75rem">(' + (t.longshots_ganados||0) + '/' + (t.longshots_resueltos||0) + ')</span></td>' +
      '<td style="color:#a78bfa;font-weight:600">' + fmtScore(sc) + '</td>' +
      '<td style="color:#64748b;font-size:0.8rem">' + dt + '</td>' +
      '<td><button class="btn outline" style="padding:3px 10px;font-size:0.75rem" onclick="addToWatchlistQuick(\'' + t.wallet + '\')">+ Watch</button></td>' +
      '</tr>';
  }).join('');
}

async function openTrader(wallet) {
  document.getElementById('modal-wallet').innerHTML = wallet +
    ' <a href="https://polymarket.com/profile/' + wallet +
    '" target="_blank" style="font-size:0.75rem;color:#64748b;text-decoration:none;border:1px solid #2d3148;padding:2px 8px;border-radius:4px;margin-left:8px">Ver en Polymarket ↗</a>';
  document.getElementById('modal-stats').innerHTML = '<div class="loader">Cargando...</div>';
  document.getElementById('modal-trades').innerHTML = '';
  document.getElementById('modal-bg').classList.add('open');
  var resp = await fetch('/api/trader/' + wallet);
  var d = await resp.json();
  document.getElementById('modal-stats').innerHTML =
    '<div class="stat-card"><div class="label">Total trades</div><div class="value">' + d.total_trades + '</div></div>' +
    '<div class="stat-card"><div class="label">Compras</div><div class="value">' + d.buys + '</div></div>' +
    '<div class="stat-card"><div class="label">Precio medio</div><div class="value">' + d.avg_price + '</div></div>' +
    '<div class="stat-card"><div class="label">Longshots</div><div class="value">' + d.longshots + '</div></div>' +
    '<div class="stat-card"><div class="label">Score insider</div><div class="value">' + d.insider_score + '%</div></div>';
  document.getElementById('modal-trades').innerHTML = d.trades.map(function(t) {
    var diff = t.price < 0.15 ? '<span class="badge purple">Muy alto riesgo</span>'
             : t.price < 0.3  ? '<span class="badge yellow">Alto riesgo</span>'
             : t.price < 0.6  ? '<span class="badge green">Moderado</span>'
             : '<span class="badge" style="background:#1e2235;color:#94a3b8">Favorito</span>';
    var dt = t.timestamp ? new Date(t.timestamp).toLocaleDateString('es-ES') : '—';
    var q  = (t.question || t.market_id || '').slice(0,45);
    return '<tr>' +
      '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis" title="' + (t.question||'') + '">' + q + '</td>' +
      '<td><span class="badge ' + (t.side==='BUY'?'green':'red') + '">' + t.side + '</span></td>' +
      '<td>' + (t.price||0).toFixed(3) + '</td>' +
      '<td>' + (t.size||0).toFixed(0) + ' USDC</td>' +
      '<td style="color:#64748b">' + dt + '</td>' +
      '<td>' + diff + '</td></tr>';
  }).join('');
}

function closeModal(e) { if (e.target.id==='modal-bg') closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-bg').classList.remove('open'); }

async function loadWatchlist() {
  var resp = await fetch('/api/watchlist');
  var list = await resp.json();
  var el = document.getElementById('watchlist-list');
  if (!list.length) { el.innerHTML = '<div class="empty">Tu watchlist está vacía.</div>'; return; }
  el.innerHTML = list.map(function(w) {
    return '<div class="watchlist-item">' +
      '<div><div class="alias">' + (w.alias||'Sin alias') + '</div>' +
      '<div class="waddr">' + w.wallet + '</div></div>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="btn outline" onclick="openTrader(\'' + w.wallet + '\')">Ver trades</button>' +
      '<button class="btn danger" onclick="removeWatchlist(\'' + w.wallet + '\')">Eliminar</button></div></div>';
  }).join('');
}

async function addWatchlist() {
  var wallet = document.getElementById('wl-wallet').value.trim();
  var alias  = document.getElementById('wl-alias').value.trim();
  if (!wallet) { alert('Introduce una wallet'); return; }
  await fetch('/api/watchlist', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({wallet:wallet, alias:alias}) });
  document.getElementById('wl-wallet').value = '';
  document.getElementById('wl-alias').value = '';
  loadWatchlist();
}

async function addToWatchlistQuick(wallet) {
  await fetch('/api/watchlist', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({wallet:wallet, alias:''}) });
  alert('Añadido a watchlist');
}

async function removeWatchlist(wallet) {
  await fetch('/api/watchlist/' + wallet, {method:'DELETE'});
  loadWatchlist();
}

async function refreshData() {
  document.getElementById('last-update').textContent = 'Actualizando...';
  await fetch('/api/refresh', {method:'POST'});
  loadRanking();
}

loadRanking();
</script>
</body>
</html>
